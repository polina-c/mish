name: website
description: The Cut for Change website, a digital business card for film editor Mikhail Cherkasov.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  # The 0.24 beta matches the installed Jaspr CLI (0.24.0-beta.1), which
  # refuses projects on 0.23. beta.2 is needed for `dialog()` with `showModal()`.
  jaspr: ^0.24.0-beta.2
  shared:
    path: ../shared
  source_span: ^1.10.2
  universal_web: ^1.1.1

dev_dependencies:
  build_runner: ^2.16.2
  build_web_compilers: ^4.8.12
  jaspr_builder: ^0.24.0-beta.2
  lints: ^6.1.0

jaspr:
  mode: static
