# Sample edits on the website, from top to bottom.
#
# Each sample edit starts with "- " and has these fields:
#
#   vimeo_id          The number in the video's Vimeo address.
#   vimeo_access_key  Only for unlisted videos: the code after the number in
#                     the address (vimeo.com/1110117832/4e7e3098ae). Leave the
#                     line out for public videos.
#   vimeo_title       The video's name. Screen readers announce it.
#   thumbnail_image   An image file in web/images/thumbnails/, 1024x576.
#   title             The lines on the grey bar, one "- " per line.
#   description       The lines under it. Optional.
#
# In titles and descriptions you can use <b>bold</b>, <i>italic</i> and
# <a href="https://example.com">links</a>.
#
# To reorder sample edits, move a whole block. To add one, copy a block.
# See content/README.md for more.

